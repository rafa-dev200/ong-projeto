<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cadastro de voluntários da Associação Santo André">
  <meta name="author" content="Rafael de Souza">
  <title>Cadastro — Associação Santo André</title>

  <style>
    .img-50 {
      width: 50%;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>Associação Santo André</h1>
    <nav aria-label="Menu principal">
      <a href="index.html">Início</a> |
      <a href="projetos.html">Projetos</a> |
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <!-- SEÇÃO INICIAL -->
  <main>
    <section aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Cadastro de Voluntário</h2>

      <img src="img/cadastro-ilustracao.jpg.png"
      srcset="img/cadastro-ilustracao.webp 1x, img/cadastro-ilustracao.jpg.png 2x"
      alt="Ilustração de voluntário se cadastrando"
      class="img-50">

      <p>Preencha o formulário abaixo para fazer parte dos nossos projetos sociais.</p>
    </section>

    <!-- FORMULÁRIO -->
    <form action="#" method="post">
      <fieldset>
        <legend>Informações Pessoais</legend>

        <label for="nome">Nome Completo:</label><br>
        <input id="nome" name="nome" type="text" required placeholder="Seu nome completo"><br><br>

        <label for="email">E-mail:</label><br>
        <input id="email" name="email" type="email" required placeholder="email@exemplo.com"><br><br>

        <label for="cpf">CPF:</label><br>
        <input id="cpf" name="cpf" type="text" required placeholder="000.000.000-00"><br><br>

        <label for="telefone">Telefone:</label><br>
        <input id="telefone" name="telefone" type="tel" required placeholder="(11) 99999-9999"><br><br>

        <label for="nascimento">Data de Nascimento:</label><br>
        <input id="nascimento" name="nascimento" type="date" required><br><br>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <label for="endereco">Endereço:</label><br>
        <input id="endereco" name="endereco" type="text" required placeholder="Rua, número e bairro"><br><br>

        <label for="cep">CEP:</label><br>
        <input id="cep" name="cep" type="text" required placeholder="00000-000"><br><br>

        <label for="cidade">Cidade:</label><br>
        <input id="cidade" name="cidade" type="text" required placeholder="Sua cidade"><br><br>

        <label for="estado">Estado:</label><br>
        <input id="estado" name="estado" type="text" required placeholder="Seu estado"><br><br>
      </fieldset>

      <button type="submit">Enviar Cadastro</button>
    </form>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>📍 Rua Marina Cintra, nº 70 - Jardim Santa Cristina, Santo André/SP</p>
    <p>📞 (11) 4453-3432</p>
  </footer>

</body>
</html>
