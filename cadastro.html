<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Associação Santo André</title>
  <link rel="stylesheet" href="styles/styles.css">
  <script defer src="scripts/scripts.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="container header-container">
      <h1 class="logo">Associação Santo André</h1>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>

      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="cadastro.html" class="active">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container cadastro">
    <h2>Cadastro de Voluntários e Doadores</h2>

    <img 
      src="img/cadastro-ilustracao.jpg.png"
      srcset="img/cadastro-ilustracao.webp 1x, img/cadastro-ilustracao.jpg.png 2x"
      alt="Ilustração de cadastro"
      class="cadastro-img img-45">

    <form id="formCadastro" novalidate>
      <fieldset>
        <legend>Dados Pessoais</legend>
        <input type="text" id="nome" placeholder="Nome completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="text" id="cpf" placeholder="CPF" required>
        <input type="tel" id="telefone" placeholder="Telefone" required>
        <input type="date" id="data" required>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <input type="text" id="endereco" placeholder="Endereço" required>
        <input type="text" id="cidade" placeholder="Cidade" required>
        <input type="text" id="estado" placeholder="Estado" required>
      </fieldset>

      <fieldset>
        <legend>Interesse</legend>
        <select id="interesse" required>
          <option value="">Selecione</option>
          <option value="voluntariado">Voluntariado</option>
          <option value="doacao">Doação</option>
        </select>
      </fieldset>

      <button type="submit" class="btn btn-primary">Enviar Cadastro</button>
      <p id="mensagem"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <p>© <span id="year"></span> Associação Santo André — Solidariedade e Ação</p>
    </div>
  </footer>

</body>
</html>
